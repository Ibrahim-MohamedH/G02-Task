<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body{
        height: 40000px;
      }
      .div2, .div3{
        width: 50px;
        height: 50px;
        position: absolute;
      }
      .div1{
        width: 100%;
        height: 50px;
        background-color: blue;
        position: fixed;
        z-index: 9999;
      }
      .div2{
        background-color: green;
        top: 25px;
        z-index: 1;
      }
      .div3{
        background-color: red;
        top: 50px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>

  </body>
</html>
